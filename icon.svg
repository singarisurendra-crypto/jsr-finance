<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="235" r="160" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Inner Gold Circle Accent -->
  <circle cx="256" cy="235" r="140" fill="rgba(15, 23, 42, 0.6)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />

  <!-- Indian Rupee Symbol (₹) in Gold Gradient -->
  <g fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Top Horizontal Bar -->
    <rect x="180" y="145" width="152" height="24" rx="8" />
    <!-- Second Horizontal Bar -->
    <rect x="180" y="195" width="125" height="22" rx="7" />
    <!-- Vertical Stem -->
    <rect x="210" y="145" width="26" height="180" rx="8" />
    <!-- Upper Loop Curve -->
    <path d="M 230 145 C 310 145, 310 240, 230 240 Z" fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round" />
    <!-- Downward Diagonal Leg -->
    <polygon points="218,240 248,240 330,345 295,345" />
  </g>

  <!-- JSR FINANCE Branding Wordmark at Bottom -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">JSR FINANCE</text>
  <text x="256" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="2">FIELD COLLECTION</text>
</svg>
